name: Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes html-validate@11 index.html projects.html
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments index.html projects.html
          fail: true
